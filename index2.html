<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Cactus Collection</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f3f3f3; }
    .container { max-width: 1000px; margin: 50px auto; padding: 20px; background: white; border-radius: 10px; }
    select, input { width: 80%; padding: 10px; margin: 10px 0; font-size: 16px; }
    .result { margin-top: 20px; }
    .card {
      display: inline-block;
      width: 220px;
      margin: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #fafafa;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      vertical-align: top;
    }
    .card img { max-width: 100%; border-radius: 10px; }
    .not-found { color: red; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌵 My Cactus Collection</h1>

    <select id="speciesDropdown">
      <option value="">-- Select species --</option>
    </select>

    <input type="text" id="search" placeholder="Search by name...">
    <div id="result"></div>
  </div>

  <script>
    let cacti = [];

    // List of JSON files (one per folder)
    const jsonFiles = [
      "2023-10.json", "2024-05.json", "2024-07.json", "2024-08.json", "2024-10.json", "2025-07.json", "2025-03.json"
    ];

    // Load all JSON files
    Promise.all(jsonFiles.map(file => fetch(file).then(res => res.json())))
      .then(allData => {
        // Flatten arrays from multiple JSON files
        cacti = allData.flat();

        populateDropdown();
      });

    const resultDiv = document.getElementById('result');
    const searchInput = document.getElementById('search');
    const speciesDropdown = document.getElementById('speciesDropdown');

    function populateDropdown() {
    const speciesSet = new Set();
    cacti.forEach(c => {
        if (c.name) {
        const species = c.name.split(' ')[0]; // get first word as species
        speciesSet.add(species);
        }
    });

    // Convert set to array and sort alphabetically
    const sortedSpecies = Array.from(speciesSet).sort((a, b) => a.localeCompare(b));

    sortedSpecies.forEach(species => {
        const option = document.createElement('option');
        option.value = species;
        option.textContent = species;
        speciesDropdown.appendChild(option);
    });
    }

      resultDiv.innerHTML = '';
      if (filteredCacti.length === 0) {
        resultDiv.innerHTML = `<p class="not-found">❌ No matching cacti found</p>`;
        return;
      }

      filteredCacti.forEach(c => {
        const name = c.name || 'unknown';
        const price = c.price ? c.price + ',00 RSD' : 'unknown';
        const notes = c.notes || 'unknown';
        const folder = c.folder || '';

            <p class="notes">${notes}</p>
          </div>
        `;
        resultDiv.innerHTML += card;
      });
    }*/
    function displayCacti(filteredCacti) {
  resultDiv.innerHTML = '';
  if (filteredCacti.length === 0) {
    resultDiv.innerHTML = `<p class="not-found">❌ No matching cacti found</p>`;
    return;
  }

  // Sort alphabetically by species (first word in name)
  filteredCacti.sort((a, b) => {
  const getSpecies = c => {
    if (!c.name) return '';
    const words = c.name.split(' ');
    return words.length > 1 ? words[1].toLowerCase() : words[0].toLowerCase();
  };
  return getSpecies(a).localeCompare(getSpecies(b));
});


  const fragment = document.createDocumentFragment();

  filteredCacti.forEach(c => {
    const name = c.name || 'unknown';
    const price = c.price ? c.price + ',00 RSD' : 'unknown';
    const notes = c.notes || 'unknown';
    const folder = c.folder || '';
    const file = c.file || '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${name}</h3>
      <img src="${folder}/${file}" alt="${name}">
      <p>${price}</p>
      <p class="notes">${notes}</p>
    `;
    fragment.appendChild(card);
  });

  resultDiv.appendChild(fragment);
}



    // Event listeners
    //searchInput.addEventListener('input', filterCacti);
    let debounceTimeout;

    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimeout);
      debounceTimeout = setTimeout(filterCacti, 200); // wait 200ms after last keystroke
    });

    speciesDropdown.addEventListener('change', filterCacti);

    function filterCacti() {
      const query = searchInput.value.toLowerCase();
      const selectedSpecies = speciesDropdown.value;

      const filtered = cacti.filter(c => {
        const nameMatch = c.name ? c.name.toLowerCase().includes(query) : false;
        const speciesMatch = selectedSpecies ? (c.name && c.name.split(' ')[0] === selectedSpecies) : true;
        return nameMatch && speciesMatch;
      });

      displayCacti(filtered);
    }
  </script>
</body>
</html>
